<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Login</title>
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; margin: 0; padding: 20px; font-family: Arial, sans-serif;">
  
  <div style="max-width: 400px; margin: 50px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 2px 20px rgba(0,0,0,0.2);">
    
    <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Login</h2>
    
    <form id="loginForm">
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: 500; color: #555;">Username</label>
        <input type="text" id="username" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;" />
      </div>
      
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: 500; color: #555;">Password</label>
        <input type="password" id="password" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;" />
      </div>
      
      <button type="submit" style="width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 500;">
        Login
      </button>
      
      <div id="message" style="margin-top: 15px; padding: 10px; border-radius: 4px; text-align: center; display: none;"></div>
    </form>
    
    <p style="text-align: center; margin-top: 20px; color: #666;">
      Test: myuser / mypass123
    </p>
    
  </div>

  <script>
    console.log('Login page loaded!');
    
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      console.log('Form submitted');
      
      const messageEl = document.getElementById('message');
      messageEl.style.display = 'block';
      messageEl.style.background = '#e3f2fd';
      messageEl.style.color = '#1976d2';
      messageEl.textContent = 'Logging in...';
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      try {
        const response = await fetch('https://web-production-9c4a.up.railway.app/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });
        
        const data = await response.json();
        console.log('Response:', data);
        
        if (response.ok) {
          window.localStorage.setItem('token', data.token);
          window.localStorage.setItem('user', JSON.stringify(data.user));
          messageEl.style.background = '#e6ffe6';
          messageEl.style.color = '#008800';
          messageEl.textContent = 'Success! Redirecting...';
          
          setTimeout(function() {
            window.location.href = 'index.html';
          }, 1000);
        } else {
          messageEl.style.background = '#ffe6e6';
          messageEl.style.color = '#cc0000';
          messageEl.textContent = data.error || 'Login failed';
        }
      } catch (error) {
        console.error('Error:', error);
        messageEl.style.background = '#ffe6e6';
        messageEl.style.color = '#cc0000';
        messageEl.textContent = 'Connection error: ' + error.message;
      }
    });
    
    console.log('Script finished loading');
  </script>
  
</body>
</html>
