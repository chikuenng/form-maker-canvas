<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Maker - Canvas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Form Maker - Canvas</h1>
        <p>A modern form builder with canvas functionality</p>
      </header>

      <main class="main">
        <div class="canvas-section">
          <h2>Canvas Items</h2>
          <div id="loading" class="loading">Loading canvas items...</div>
          <div id="error" class="error" style="display: none">
            <p id="error-message"></p>
            <button onclick="fetchCanvasItems()">Retry</button>
          </div>
          <div id="canvas-items" class="canvas-items" style="display: none">
            <div id="items-grid" class="items-grid"></div>
          </div>
        </div>

        <div class="form-section">
          <h2>Form Builder</h2>
          <div class="form-builder">
            <h3>Add New Canvas Item</h3>
            <form id="add-form">
              <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required />
              </div>
              <div class="form-group">
                <label for="type">Type:</label>
                <select id="type" name="type" required>
                  <option value="">Select Type</option>
                  <option value="form">Form</option>
                  <option value="input">Input</option>
                  <option value="button">Button</option>
                  <option value="checkbox">Checkbox</option>
                  <option value="radio">Radio</option>
                </select>
              </div>
              <div class="form-group">
                <label for="width">Width:</label>
                <input type="number" id="width" name="width" min="1" required />
              </div>
              <div class="form-group">
                <label for="height">Height:</label>
                <input
                  type="number"
                  id="height"
                  name="height"
                  min="1"
                  required
                />
              </div>
              <button type="submit">Add Item</button>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
