<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Test</title>
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
      }
      .auth-container {
        max-width: 400px;
        width: 90%;
        padding: 30px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
        color: #555;
      }
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 500;
        margin-top: 10px;
      }
      button:hover {
        background: #0056b3;
      }
      .message {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        text-align: center;
        display: none;
      }
      .error {
        background: #ffe6e6;
        color: #cc0000;
        display: block;
      }
      .success {
        background: #e6ffe6;
        color: #008800;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <h2>Login</h2>
      <form id="login-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit">Login</button>
        <div id="message" class="message"></div>
      </form>
      <p style="text-align: center; margin-top: 20px">
        <a href="#" id="signup-link" style="color: #007bff">Create account</a>
      </p>
    </div>

    <script>
      const API_URL = 'https://web-production-9c4a.up.railway.app';

      document
        .getElementById('login-form')
        .addEventListener('submit', async (e) => {
          e.preventDefault();
          const messageEl = document.getElementById('message');
          messageEl.className = 'message';
          messageEl.textContent = 'Logging in...';
          messageEl.style.display = 'block';

          const username = document.getElementById('username').value;
          const password = document.getElementById('password').value;

          try {
            const response = await fetch(`${API_URL}/api/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password }),
            });

            const data = await response.json();

            if (response.ok) {
              window.localStorage.setItem('token', data.token);
              window.localStorage.setItem('user', JSON.stringify(data.user));
              messageEl.className = 'message success';
              messageEl.textContent = 'Success! Redirecting...';
              setTimeout(() => {
                window.location.href = 'index.html';
              }, 1000);
            } else {
              messageEl.className = 'message error';
              messageEl.textContent = data.error || 'Login failed';
            }
          } catch (error) {
            messageEl.className = 'message error';
            messageEl.textContent = 'Connection error: ' + error.message;
          }
        });

      document.getElementById('signup-link').addEventListener('click', (e) => {
        e.preventDefault();
        alert('Signup: Use myuser / mypass123 or create via API');
      });
    </script>
  </body>
</html>
