version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: formmaker-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=admin
      - DB_PASSWORD=Bng20071962!
      - DB_NAME=FormMaker
      - PORT=3001
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - formmaker-network
    command: npm run dev

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: formmaker-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - formmaker-network

networks:
  formmaker-network:
    driver: bridge
